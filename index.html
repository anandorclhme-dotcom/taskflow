<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>AnandTaskManagent</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="auth"><div class="box"><h1>AnandTaskManagent</h1><p>Tasks • Projects • Time</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="name" placeholder="Full name"><div class="row"><button id="login">Login</button><button id="signup" class="secondary">Create account</button></div><p id="msg"></p></div></div>
<div id="app" class="hidden"><header><b>AnandTaskManagent</b><div><span id="who"></span> <button id="logout" class="secondary">Logout</button></div></header><main><div class="stats"><div>Today<b id="today">0</b></div><div>Overdue<b id="overdue">0</b></div><div>Completed<b id="completed">0</b></div><div>Tracked<b id="tracked">0m</b></div></div><div class="grid"><section class="panel"><div class="head"><h2>Projects</h2><button id="newProject">+ Project</button></div><div id="projects"></div></section><section class="panel"><div class="head"><h2>Tasks</h2><div><select id="filter"><option value="all">All</option><option value="open">Open</option><option value="today">Today</option><option value="done">Completed</option></select><button id="newTask">+ Task</button></div></div><div id="tasks"></div></section></div><section class="panel timer"><div><h2>Time Tracker</h2><p id="timerTask">Choose Track on a task.</p></div><div><strong id="clock">00:00:00</strong></div></section></main></div>
<dialog id="taskDlg"><form method="dialog"><h2>Task</h2><input id="taskId" type="hidden"><input id="taskName" placeholder="Task name" required><select id="taskProject"></select><input id="taskDue" type="datetime-local"><select id="taskPriority"><option>low</option><option selected>medium</option><option>high</option><option>urgent</option></select><input id="taskEstimate" type="number" min="0" value="30"><div class="row"><button value="cancel" class="secondary">Cancel</button><button id="saveTask">Save</button></div></form></dialog>
<dialog id="projectDlg"><form method="dialog"><h2>New Project</h2><input id="projectName" placeholder="Project name" required><div class="row"><button value="cancel" class="secondary">Cancel</button><button id="saveProject">Create</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
