name: TaskFlow UI v4 patch
on:
  push:
    paths:
      - '.github/workflows/taskflow_ui_v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        shell: bash
        run: |
          cat >> index.html <<'EOF'
<script>
(function(){
const B='https://aerytmekaqqheyjjnwwd.supabase.co',K='sb_publishable_JL1U2PYC7uftN_hbMHYsDw_tiMxHz3M';
const T=()=>localStorage.getItem('atm_access_token')||'';const U=()=>{try{return JSON.parse(localStorage.getItem('atm_user')||'null')}catch{return null}};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,o={}){let h=Object.assign({'apikey':K,'Content-Type':'application/json'},o.headers||{});if(T())h.Authorization='Bearer '+T();let r=await fetch(B+path,{...o,headers:h}),txt=await r.text(),d={};try{d=txt?JSON.parse(txt):{}}catch{}if(!r.ok)throw Error(d.message||d.msg||d.error_description||'Request failed');return d}
function miniButton(text,cls){return '<button type="button" class="mini-action '+(cls||'')+'">'+text+'</button>'}
const style=document.createElement('style');style.textContent='.mini-action{padding:4px 7px!important;font-size:10px!important;line-height:1.1!important;border-radius:7px!important;font-weight:600!important}.item-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}.editdlg-grid{display:grid;gap:4px}.editdlg-grid label{font-size:12px;color:#64748b;font-weight:600}.editdlg-grid input,.editdlg-grid select,.editdlg-grid textarea{display:block;width:100%;padding:11px;margin:4px 0 8px;border:1px solid #dbe1ea;border-radius:10px;background:#fff;font:inherit}.goal-simple{border:1px solid #e8ebf2;border-radius:12px;padding:12px;margin:8px 0}.goal-simple .meta{margin-top:5px}.status-pending{background:#fff7ed;color:#c2410c}.status-inprogress{background:#eff6ff;color:#1d4ed8}.status-completed{background:#ecfdf5;color:#047857}.status-pill{display:inline-block;padding:3px 7px;border-radius:99px;font-size:10px;font-weight:700}.item-actions .danger{background:#fee2e2!important;color:#b91c1c!important}.item-actions .secondary{background:#eef2ff!important;color:#3730a3!important}';document.head.appendChild(style);
function addField(parent,id,label,type,value,extra){let wrap=document.createElement('div');wrap.innerHTML='<label>'+label+'</label><input id="'+id+'" type="'+type+'" '+(extra||'')+' value="'+(value||'')+'">';parent.appendChild(wrap);return $(id)}
function addSelect(parent,id,label,options,value){let wrap=document.createElement('div');wrap.innerHTML='<label>'+label+'</label><select id="'+id+'">'+options.map(x=>'<option value="'+x[0]+'" '+(x[0]===value?'selected':'')+'>'+x[1]+'</option>').join('')+'</select>';parent.appendChild(wrap);return $(id)}
function ensureDialogs(){
 const gd=$('goalDlg');if(gd&&!$('goalDue')){let f=gd.querySelector('form');let metric=$('goalMetric')?.parentElement,target=$('goalTarget')?.parentElement;if(metric)metric.style.display='none';if(target)target.style.display='none';let due=document.createElement('div');due.innerHTML='<label>Due Date</label><input id="goalDue" type="date" required>';target?.after(due);let st=document.createElement('div');st.innerHTML='<label>Status</label><select id="goalStatus"><option value="pending">Pending</option><option value="inprogress">In Progress</option><option value="completed">Completed</option></select>';due.after(st);let h=gd.querySelector('h2');if(h)h.textContent='🎯 Goal';}
 const pd=$('projectDlg');if(pd&&!$('projectDue')){let f=pd.querySelector('form'),buttons=f.querySelector('.row');let c=document.createElement('div');c.className='editdlg-grid';c.innerHTML='<label>Due Date</label><input id="projectDue" type="date"><label>Status</label><select id="projectStatus"><option value="active">Active</option><option value="inprogress">In Progress</option><option value="completed">Completed</option><option value="pending">Pending</option></select>';buttons.before(c);}
 const td=$('taskDlg');if(td&&!$('taskStatus')){let f=td.querySelector('form'),buttons=f.querySelector('.row');let c=document.createElement('div');c.className='editdlg-grid';c.innerHTML='<label>Status</label><select id="taskStatus"><option value="todo">Pending</option><option value="inprogress">In Progress</option><option value="done">Completed</option></select>';buttons.before(c);}
}
let editGoalId=null,editProjectId=null,editTaskId=null;
async function refresh(){location.reload()}
function openGoal(id){let g=window.__tf_goals?.find(x=>x.id===id);if(!g)return;ensureDialogs();editGoalId=id;$('goalPeriod').value=g.period||'weekly';$('goalTitle').value=g.title||'';$('goalDescription').value=g.description||'';$('goalDue').value=g.end_date||'';$('goalStatus').value=g.status||'pending';$('saveGoalBtn').textContent='Save changes';$('goalDlg').showModal()}
async function saveGoal(e){e?.preventDefault();ensureDialogs();let title=$('goalTitle').value.trim(),due=$('goalDue').value,status=$('goalStatus').value,period=$('goalPeriod').value;if(!title||!due)return alert('Goal Title and Due Date are required.');let payload={period,title,description:$('goalDescription').value.trim(),end_date:due,status,updated_at:new Date().toISOString(),metric:null,target_value:null};try{if(editGoalId)await api('/rest/v1/goals?id=eq.'+encodeURIComponent(editGoalId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});else await api('/rest/v1/goals',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({...payload,user_id:U()?.id,start_date:new Date().toISOString().slice(0,10)})});$('goalDlg').close();editGoalId=null;$('saveGoalBtn').textContent='Create goal';refresh()}catch(err){alert(err.message)}}
async function delGoal(id){if(!confirm('Delete this goal? This cannot be undone.'))return;try{await api('/rest/v1/goals?id=eq.'+encodeURIComponent(id),{method:'DELETE'});refresh()}catch(e){alert(e.message)}}
async function loadGoals(){try{let gs=await api('/rest/v1/goals?select=*&order=end_date.asc');window.__tf_goals=gs;let box=$('goals');if(!box)return;let period=document.querySelector('#goalTabs button.active')?.dataset.period||'weekly';let a=gs.filter(g=>(g.period||'weekly')===period);box.innerHTML=a.map(g=>'<div class="goal-simple"><div class="goal-title">'+esc(g.title)+' <span class="status-pill status-'+esc(g.status||'pending')+'">'+esc((g.status||'pending').replace('inprogress','In Progress').replace(/^./,m=>m.toUpperCase()))+'</span></div><div class="meta">'+esc(g.description||'No description')+' · Due: '+(g.end_date?new Date(g.end_date+'T00:00:00').toLocaleDateString():'—')+' · '+esc((g.period||'weekly').replace(/^./,m=>m.toUpperCase()))+'</div><div class="item-actions">'+miniButton('Edit','secondary')+miniButton('Delete','danger')+'</div></div>').join('')||'<p class="muted">No goals for this period.</p>';[...box.querySelectorAll('.goal-simple')].forEach((el,i)=>{let g=a[i];let bs=el.querySelectorAll('.mini-action');bs[0].onclick=()=>openGoal(g.id);bs[1].onclick=()=>delGoal(g.id)})}catch(e){console.error(e)}}
async function saveProject(e){e?.preventDefault();let n=$('projectName').value.trim();if(!n)return;try{let p={name:n,due_date:$('projectDue').value||null,status:$('projectStatus').value,updated_at:new Date().toISOString()};if(editProjectId)await api('/rest/v1/projects?id=eq.'+encodeURIComponent(editProjectId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});else await api('/rest/v1/projects',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({...p,user_id:U()?.id})});$('projectDlg').close();editProjectId=null;$('saveProjectBtn').textContent='Create';refresh()}catch(e){alert(e.message)}}
function openProject(id){let p=window.__tf_projects?.find(x=>x.id===id);if(!p)return;ensureDialogs();editProjectId=id;$('projectName').value=p.name||'';$('projectDue').value=p.due_date||'';$('projectStatus').value=p.status||'active';$('saveProjectBtn').textContent='Save changes';$('projectDlg').showModal()}
async function delProject(id){if(!confirm('Delete this project and its tasks/time records?'))return;try{await api('/rest/v1/time_entries?task_id=in.('+((window.__tf_tasks||[]).filter(t=>t.project_id===id).map(t=>t.id).join(','))+')',{method:'DELETE'});await api('/rest/v1/tasks?project_id=eq.'+encodeURIComponent(id),{method:'DELETE'});await api('/rest/v1/projects?id=eq.'+encodeURIComponent(id),{method:'DELETE'});refresh()}catch(e){alert(e.message)}}
async function saveTask(e){e?.preventDefault();let n=$('taskName').value.trim();if(!n)return;try{let p={title:n,project_id:$('taskProject').value||null,due_at:$('taskDue').value?new Date($('taskDue').value).toISOString():null,priority:$('taskPriority').value,estimated_minutes:+$('taskEstimate').value||0,status:$('taskStatus').value,updated_at:new Date().toISOString()};if(editTaskId)await api('/rest/v1/tasks?id=eq.'+encodeURIComponent(editTaskId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});else await api('/rest/v1/tasks',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({...p,user_id:U()?.id,actual_minutes:0})});$('taskDlg').close();editTaskId=null;$('saveTaskBtn').textContent='Save';refresh()}catch(e){alert(e.message)}}
function openTask(id){let t=window.__tf_tasks?.find(x=>x.id===id);if(!t)return;ensureDialogs();editTaskId=id;$('taskName').value=t.title||'';$('taskProject').value=t.project_id||'';$('taskDue').value=t.due_at?new Date(t.due_at).toISOString().slice(0,16):'';$('taskPriority').value=t.priority||'medium';$('taskEstimate').value=t.estimated_minutes||0;$('taskStatus').value=t.status||'todo';$('saveTaskBtn').textContent='Save changes';$('taskDlg').showModal()}
async function delTask(id){if(!confirm('Delete this task and its tracked time?'))return;try{await api('/rest/v1/time_entries?task_id=eq.'+encodeURIComponent(id),{method:'DELETE'});await api('/rest/v1/tasks?id=eq.'+encodeURIComponent(id),{method:'DELETE'});refresh()}catch(e){alert(e.message)}}
function enhance(){ensureDialogs();let ps=[...document.querySelectorAll('#projects [data-project]')];window.__tf_projects=ps.map(x=>({id:x.dataset.project,name:x.querySelector('b')?.textContent||'',due_date:null,status:'active'}));let ts=[...document.querySelectorAll('#tasks [data-check]')];window.__tf_tasks=ts.map(x=>({id:x.dataset.check,project_id:null,title:x.parentElement?.querySelector('.name')?.textContent||''}));document.querySelectorAll('#projects [data-project]').forEach(el=>{if(el.querySelector('[data-edit-project]'))return;let id=el.dataset.project;let a=document.createElement('div');a.className='item-actions';a.innerHTML=miniButton('Edit','secondary')+miniButton('Delete','danger');el.appendChild(a);let bs=a.querySelectorAll('button');bs[0].setAttribute('data-edit-project',id);bs[0].onclick=e=>{e.stopPropagation();loadDataAndOpenProject(id)};bs[1].onclick=e=>{e.stopPropagation();delProject(id)}});document.querySelectorAll('#tasks .task').forEach(el=>{let track=el.querySelector('[data-track]');if(!track||el.querySelector('[data-edit-task]'))return;let id=el.querySelector('[data-check]')?.dataset.check;let a=document.createElement('div');a.className='item-actions';a.innerHTML=miniButton('Edit','secondary')+miniButton('Delete','danger');el.appendChild(a);a.querySelector('[data-edit-task]')?.remove();let bs=a.querySelectorAll('button');bs[0].setAttribute('data-edit-task',id);bs[0].onclick=()=>loadDataAndOpenTask(id);bs[1].onclick=()=>delTask(id)})}
async function loadDataAndOpenProject(id){window.__tf_projects=await api('/rest/v1/projects?select=*');openProject(id)}
async function loadDataAndOpenTask(id){window.__tf_tasks=await api('/rest/v1/tasks?select=*');$('taskProject').innerHTML=(await api('/rest/v1/projects?select=*&order=created_at.asc')).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');openTask(id)}
const oldOpenGoal=$('newGoalBtn')?.onclick;$('newGoalBtn')?.addEventListener('click',()=>{editGoalId=null;ensureDialogs();$('goalDue').value='';$('goalStatus').value='pending';$('saveGoalBtn').textContent='Create goal';});$('saveGoalBtn')?.addEventListener('click',saveGoal,true);
$('saveProjectBtn')?.addEventListener('click',saveProject,true);$('saveTaskBtn')?.addEventListener('click',saveTask,true);
$('newProjectBtn')?.addEventListener('click',()=>{editProjectId=null;ensureDialogs();$('projectDue').value='';$('projectStatus').value='active';$('saveProjectBtn').textContent='Create';});$('newTaskBtn')?.addEventListener('click',()=>{editTaskId=null;ensureDialogs();$('taskStatus').value='todo';$('saveTaskBtn').textContent='Save';});
$('goalTabs')?.addEventListener('click',()=>setTimeout(loadGoals,30));
const mo=new MutationObserver(()=>{enhance()});mo.observe(document.body,{childList:true,subtree:true});setInterval(()=>{enhance();loadGoals()},2500);setTimeout(()=>{enhance();loadGoals()},500);
})();
</script>
EOF
          git config user.name 'TaskFlow Bot'
          git config user.email 'taskflow-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement editable goals and project/task scheduling' || true
          git push
