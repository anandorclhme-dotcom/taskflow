name: Apply TaskFlow V4 override
on:
  push:
    paths:
      - 'v4-overrides.js'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach V4 override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/v4-overrides.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V4 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply TaskFlow V4 goal and delete controls'
          git push
