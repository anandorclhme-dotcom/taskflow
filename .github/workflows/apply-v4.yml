name: Apply TaskFlow V4/V5/V6/V7 overrides
on:
  push:
    paths:
      - 'v4-overrides.js'
      - 'v5-overrides.js'
      - 'v6-task-filters.js'
      - 'v6-task-table.js'
      - 'v7-project-task-layout.js'
      - 'app.js'
      - '.github/workflows/apply-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for tag in ['<script src="/v4-overrides.js"></script>','<script src="/v5-overrides.js"></script>','<script src="/v6-task-filters.js"></script>','<script src="/v6-task-table.js"></script>','<script src="/v7-project-task-layout.js"></script>']:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit attached overrides
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply TaskFlow V7 project and task layout'
          git push
